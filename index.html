<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sinaloa Restaurant — Ruleta de la suerte</title>
  <style>
    :root {
      --royal: #042c93;
      --royal-dark: #021a5a;
      --royal-light: #0d3eb8;
      --bone: #f7f3ea;
      --bone-deep: #ebe4d6;
      --sea-mist: #dce9f7;
      --surface: #f4f6fb;
      --text: #0f172a;
      --muted: #64748b;
      --shadow: rgba(4, 44, 147, 0.28);
      --modal-bg: rgba(15, 23, 42, 0.55);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
      color: var(--text);
      background-color: #eef2fc;
      background-image:
        radial-gradient(120% 65% at 50% -18%, rgba(4, 44, 147, 0.22) 0%, transparent 58%),
        radial-gradient(90% 55% at 110% 8%, rgba(214, 162, 74, 0.14) 0%, transparent 52%),
        radial-gradient(70% 50% at -10% 95%, rgba(4, 44, 147, 0.1) 0%, transparent 55%),
        repeating-linear-gradient(
          125deg,
          rgba(255, 255, 255, 0.06) 0 2px,
          rgba(4, 44, 147, 0.03) 2px 14px
        ),
        linear-gradient(168deg, #fdf8f0 0%, var(--sea-mist) 38%, #f6efe6 72%, #e8edf9 100%);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .banner {
      flex: 0 0 auto;
      text-align: center;
      padding: 0.85rem 1rem calc(0.85rem + env(safe-area-inset-top, 0px));
      padding-top: calc(0.85rem + env(safe-area-inset-top, 0px));
      background: linear-gradient(180deg, #1e4ad4 0%, var(--royal) 42%, var(--royal-dark) 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 10px 28px rgba(2, 26, 90, 0.45);
    }

    .banner h1 {
      margin: 0;
      font-size: clamp(1.15rem, 4vw, 1.65rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }

    .page-tagline {
      margin: 0;
      margin-bottom: 3%;
      padding: 0.6rem 1.25rem 0.45rem;
      text-align: center;
      font-family: "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(1.08rem, 3.4vw, 1.42rem);
      letter-spacing: 0.04em;
      color: #0a2463;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.75);
      border-bottom: 1px solid rgba(4, 44, 147, 0.12);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, transparent 100%);
    }

    .page-tagline::before {
      content: "✦";
      margin-right: 0.45em;
      color: rgba(214, 162, 74, 0.95);
      font-style: normal;
      font-size: 0.85em;
      vertical-align: 0.08em;
    }

    .page-tagline::after {
      content: "✦";
      margin-left: 0.45em;
      color: rgba(214, 162, 74, 0.95);
      font-style: normal;
      font-size: 0.85em;
      vertical-align: 0.08em;
    }

    main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.35rem 1rem calc(0.85rem + var(--safe-bottom));
      padding-top: 0%;
      min-height: 0;
    }

    .game-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(0.1rem, 1.5vw, 0.6rem);
      width: 100%;
      max-width: min(100%, 560px);
    }

    .wheel-stage {
      position: relative;
      width: min(88vw, min(78dvh, 520px));
      height: min(88vw, min(78dvh, 520px));
      max-width: 100%;
      max-height: calc(100dvh - 220px);
      aspect-ratio: 1;
      flex-shrink: 0;
      margin-top: clamp(-14px, -3.2vw, -6px);
      filter: drop-shadow(0 16px 26px var(--shadow));
    }

    .wheel-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(255, 255, 255, 0.15), transparent 40%, rgba(255, 255, 255, 0.08));
      pointer-events: none;
      z-index: 2;
      box-shadow:
        inset 0 0 0 10px rgba(255, 255, 255, 0.12),
        inset 0 0 40px rgba(0, 0, 0, 0.15),
        0 0 0 6px rgba(255, 255, 255, 0.25);
      border-radius: 50%;
    }

    .wheel-canvas-wrap {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #1a3fa8 0%, var(--royal-dark) 70%);
      box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.35),
        0 12px 0 rgba(0, 0, 0, 0.12);
    }

    #wheelCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .center-cap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 32%;
      height: 32%;
      min-width: 88px;
      min-height: 88px;
      max-width: 180px;
      max-height: 180px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff 0%, #e8ecf7 100%);
      box-shadow:
        0 10px 24px rgba(4, 44, 147, 0.35),
        inset 0 2px 6px rgba(255, 255, 255, 0.9),
        inset 0 -4px 10px rgba(4, 44, 147, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
      border: 3px solid rgba(255, 255, 255, 0.85);
    }

    .center-cap img {
      width: 72%;
      height: 72%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .pointer {
      position: absolute;
      left: 50%;
      top: -6px;
      transform: translateX(-50%);
      z-index: 5;
      width: 0;
      height: 0;
      border-left: clamp(14px, 4vw, 22px) solid transparent;
      border-right: clamp(14px, 4vw, 22px) solid transparent;
      border-top: clamp(28px, 8vw, 44px) solid var(--royal);
      filter:
        drop-shadow(0 -2px 0 #fff)
        drop-shadow(0 4px 8px rgba(0, 0, 0, 0.28));
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .pointer.is-hit {
      transform: translateX(-50%) scale(1.12);
      filter: drop-shadow(0 0 14px rgba(255, 215, 0, 0.95)) drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
    }

    .rim-gloss {
      position: absolute;
      inset: 2%;
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
      background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.22) 0%, transparent 45%);
    }

    .spin-btn {
      appearance: none;
      border: none;
      cursor: pointer;
      width: min(88%, 300px);
      padding: 0.95rem 1.25rem;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(180deg, var(--royal-light) 0%, var(--royal) 55%, var(--royal-dark) 100%);
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      box-shadow:
        0 8px 0 rgba(2, 26, 90, 0.35),
        0 14px 28px rgba(4, 44, 147, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
      flex-shrink: 0;
      margin-top: clamp(0.45rem, 2.2vw, 1.1rem);
    }

    .spin-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow:
        0 4px 0 rgba(2, 26, 90, 0.35),
        0 10px 22px rgba(4, 44, 147, 0.3);
    }

    .spin-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--modal-bg);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .modal-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      width: min(100%, 400px);
      background: #fff;
      border-radius: 20px;
      padding: 1.5rem 1.35rem 1.25rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      transform: translateY(16px) scale(0.96);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
      border: 1px solid rgba(4, 44, 147, 0.12);
    }

    .modal-backdrop.is-open .modal {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .modal-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--royal);
      background: rgba(4, 44, 147, 0.08);
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      margin-bottom: 0.65rem;
    }

    .modal h2 {
      margin: 0 0 0.5rem;
      font-size: 1.45rem;
      line-height: 1.2;
      color: var(--royal-dark);
    }

    .modal p {
      margin: 0 0 1.25rem;
      font-size: 0.98rem;
      line-height: 1.55;
      color: var(--muted);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .modal-close {
      appearance: none;
      border: none;
      cursor: pointer;
      padding: 0.65rem 1.1rem;
      font-weight: 700;
      border-radius: 12px;
      background: var(--royal);
      color: #fff;
      font-size: 0.95rem;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .modal-close:hover {
      background: var(--royal-light);
    }

    .modal-close:active {
      transform: scale(0.98);
    }

    .sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .sparkles.is-active {
      opacity: 1;
    }

    .spark {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff7a8;
      box-shadow: 0 0 12px #ffd54a;
      animation: sparkle 0.9s ease-out forwards;
    }

    @keyframes sparkle {
      0% {
        transform: scale(0.2);
        opacity: 0;
      }
      30% {
        opacity: 1;
      }
      100% {
        transform: scale(1.4) translateY(-10px);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <header class="banner">
    <h1>Sinaloa Restaurant</h1>
  </header>

  <p class="page-tagline">Ruleta de la suerte</p>

  <main>
    <div class="game-stack">
      <div class="wheel-stage" id="wheelStage" aria-live="polite">
        <div class="wheel-canvas-wrap">
          <canvas id="wheelCanvas" width="600" height="600" aria-label="Ruleta de premios"></canvas>
        </div>
        <div class="rim-gloss" aria-hidden="true"></div>
        <div class="wheel-ring" aria-hidden="true"></div>
        <div class="sparkles" id="sparkles" aria-hidden="true"></div>
        <div class="pointer" id="pointer" aria-hidden="true"></div>
        <div class="center-cap">
          <img src="https://mainlyx.github.io/wheel-of-fortune/logo.PNG" alt="Logo Sinaloa Restaurant" width="128" height="128" />
        </div>
      </div>
      <button type="button" class="spin-btn" id="spinBtn">¡Girar!</button>
    </div>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal">
      <span class="modal-badge">¡Felicidades!</span>
      <h2 id="modalTitle"></h2>
      <p id="modalDescription"></p>
      <div class="modal-actions">
        <button type="button" class="modal-close" id="modalClose">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    /* ========== Datos de segmentos ========== */
    // const SEGMENTS = [
    //   { label: "SUERTE PARA LA PROXIMA", description: "" },
    //   { label: "10% DE DESCUENTO 1P", description: "Se aplicara un descuento del 10% a el platillo mas caro de su cuenta que no sea especialidad" },
    //   { label: "MARGARITA GRATIS", description: "Disfruta una margarita clasi completamente gratis" },
    //   { label: "SHOT TEQUILA GRATIS", description: "Disfruta un shot de tequila centenario plata o reposado completamente gratis" },
    //   { label: "15% DE DESCUENTO 1P", description: "Se aplicara un descuento del 15% a el platillo mas caro de su cuenta que no sea especialidad" },
    //   { label: "POSTRE DEL DIA GRATIS", description: "Disfurta un postre especial del día completamente gratis, pregunta por cuales hay" },
    //   { label: "20% DE DESCUENTO 1P", description: "Se aplicara un descuento del 20% a el platillo mas caro de su cuenta que no sea especialidad" },
    //   { label: "SUERTE PARA LA PROXIMA", description: "" }
    // ];

    const SEGMENTS = [
      { label: "¡SUERTE PARA LA PRÓXIMA!", description: "¡Esta vez no hubo premio, pero podrás intentarlo nuevamente en tu próxima visita!" },
      { label: "¡10% DE DESCUENTO!", description: "¡Obtén un 10% de descuento en el platillo más caro de tu cuenta! No aplica en especialidades." },
      { label: "¡MARGARITA GRATIS!", description: "¡Disfruta una margarita clásica completamente gratis!" },
      { label: "¡SHOT GRATIS!", description: "¡Recibe un shot de tequila Centenario Plata o Reposado completamente gratis!" },
      { label: "¡SUERTE PARA LA PRÓXIMA!", description: "¡Gracias por participar! ¡Te esperamos de nuevo para seguir probando suerte!" },
      { label: "¡15% DE DESCUENTO!", description: "¡Obtén un 15% de descuento en el platillo más caro de tu cuenta! No aplica en especialidades." },
      { label: "¡POSTRE GRATIS!", description: "¡Disfruta un delicioso postre del día completamente gratis! Consulta las opciones disponibles." },
      { label: "¡20% DE DESCUENTO!", description: "¡Obtén un 20% de descuento en el platillo más caro de tu cuenta! No aplica en especialidades." },
    ];

    const SEGMENT_COLORS = [
      "#0d47a1", "#1976d2", "#0d3d8f", "#1e88e5",
      "#1346a8", "#1565c0", "#0b2f7a", "#205dcc"
    ];

    const TAU = Math.PI * 2;

    /* ========== Estado y referencias DOM ========== */
    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalTitle = document.getElementById("modalTitle");
    const modalDescription = document.getElementById("modalDescription");
    const modalClose = document.getElementById("modalClose");
    const pointerEl = document.getElementById("pointer");
    const sparklesEl = document.getElementById("sparkles");
    const wheelStage = document.getElementById("wheelStage");

    let rotation = 0;
    let spinning = false;
    let rafId = 0;
    let dpr = 1;
    let outerRadiusPx = 1;
    let innerRadiusPx = 1;

    /* ========== Utilidades ========== */
    function easeOutCubic(t) {
      const p = 1 - t;
      return 1 - p * p * p;
    }

    function randomInt(min, maxExclusive) {
      return Math.floor(Math.random() * (maxExclusive - min)) + min;
    }

    function normalizeAngle(a) {
      a = a % TAU;
      if (a < 0) a += TAU;
      return a;
    }

    /* ========== Renderizado ========== */
    function layoutCanvas() {
      const wrap = canvas.parentElement;
      const rect = wrap.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const size = Math.max(1, Math.floor(rect.width * dpr));
      canvas.width = size;
      canvas.height = size;
      outerRadiusPx = size / 2;
      innerRadiusPx = outerRadiusPx * 0.36;
      drawWheel(rotation);
    }

    function drawWheel(angleRad) {
      const n = SEGMENTS.length;
      const arc = TAU / n;
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const rOuter = outerRadiusPx - 4 * dpr;
      const rInner = innerRadiusPx;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, w, h);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angleRad);

      for (let i = 0; i < n; i++) {
        const start = -Math.PI / 2 - arc / 2 + i * arc;
        const end = start + arc;

        ctx.beginPath();
        ctx.moveTo(Math.cos(start) * rInner, Math.sin(start) * rInner);
        ctx.arc(0, 0, rOuter, start, end);
        ctx.arc(0, 0, rInner, end, start, true);
        ctx.closePath();

        const fill = SEGMENT_COLORS[i % SEGMENT_COLORS.length];
        ctx.fillStyle = fill;
        ctx.fill();

        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.lineWidth = Math.max(1, dpr);
        ctx.stroke();

        const mid = start + arc / 2;
        const rMid = (rInner + rOuter) / 2;
        drawTangentLabelInSegment(ctx, SEGMENTS[i].label, mid, arc, rMid, dpr);
      }

      ctx.restore();
    }

    /**
     * Texto pintado “sobre la ruleta”: misma tangente en todos los sectores (como ruleta física).
     * Gira con el canvas; el sector inferior puede verse “de cabeza” respecto al usuario.
     */
   
      function drawTangentLabelInSegment(ctx, text, midAngle, segmentArc, rMid, dpr) {
        const raw = String(text || "").trim();
        if (!raw) return;

        const halfArc = Math.min(segmentArc * 0.42, Math.PI / 2 - 0.05);
        const maxWidth = 2 * rMid * Math.sin(halfArc);

        let fontSize = Math.max(9 * dpr, Math.min(19 * dpr, rMid * 0.11));

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(255,255,255,0.96)";

        const setFont = (size) => {
          ctx.font = `700 ${size}px system-ui, -apple-system, "Segoe UI", sans-serif`;
        };

        // 🔥 FORZAMOS 2 LÍNEAS BALANCEADAS
        let lines = splitInTwoBalanced(raw);

        setFont(fontSize);

        // 🔥 AJUSTE DE FONT basado en la línea MÁS larga (no todo el texto)
        while (
          fontSize > 7 * dpr &&
          Math.max(...lines.map(l => ctx.measureText(l).width)) > maxWidth
        ) {
          fontSize -= 0.5 * dpr;
          setFont(fontSize);
        }

        const lineHeight = fontSize * 1.15;
        const totalHeight = lines.length * lineHeight;
        const offsetY = -totalHeight / 2 + lineHeight / 2;

        ctx.save();
        ctx.rotate(midAngle);
        ctx.translate(rMid, 0);
        ctx.rotate(Math.PI / 2);

        lines.forEach((line, i) => {
          ctx.fillText(line, 0, offsetY + i * lineHeight);
        });

        ctx.restore();
      }

      function splitInTwoBalanced(text) {
    const words = text.split(" ");

    if (words.length === 1) return [text];

    // caso ideal: 2 palabras → 1 y 1
    if (words.length === 2) {
      return [words[0], words[1]];
    }

    // dividir balanceado
    const mid = Math.ceil(words.length / 2);

    return [
      words.slice(0, mid).join(" "),
      words.slice(mid).join(" ")
    ];
  }

    /* ========== Lógica de giro ========== */
    function computeRotationDelta(currentAngle, winnerIndex) {
      const n = SEGMENTS.length;
      const arc = TAU / n;
      const targetRemainder = normalizeAngle(-winnerIndex * arc);
      const curRem = normalizeAngle(currentAngle);
      let delta = targetRemainder - curRem;
      if (delta < 0) delta += TAU;
      const extraTurns = randomInt(5, 11);
      delta += extraTurns * TAU;
      return delta;
    }

    function pickRandomWinnerIndex() {
      return Math.floor(Math.random() * SEGMENTS.length);
    }

    function burstSparkles() {
      sparklesEl.innerHTML = "";
      sparklesEl.classList.add("is-active");
      const count = 14;
      const box = wheelStage.getBoundingClientRect();
      for (let i = 0; i < count; i++) {
        const s = document.createElement("span");
        s.className = "spark";
        s.style.left = `${20 + Math.random() * 60}%`;
        s.style.top = `${15 + Math.random() * 55}%`;
        s.style.animationDelay = `${Math.random() * 0.25}s`;
        sparklesEl.appendChild(s);
      }
      pointerEl.classList.add("is-hit");
      window.setTimeout(() => {
        sparklesEl.classList.remove("is-active");
        pointerEl.classList.remove("is-hit");
        sparklesEl.innerHTML = "";
      }, 1000);
    }

    function openModal(segment) {
      modalTitle.textContent = segment.label;
      modalDescription.textContent = segment.description;
      modalBackdrop.classList.add("is-open");
      modalBackdrop.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      modalBackdrop.classList.remove("is-open");
      modalBackdrop.setAttribute("aria-hidden", "true");
    }

    function startSpin() {
      if (spinning) return;
      spinning = true;
      spinBtn.disabled = true;
      closeModal();

      const winnerIndex = pickRandomWinnerIndex();
      const startAngle = rotation;
      const delta = computeRotationDelta(startAngle, winnerIndex);
      const endAngle = startAngle + delta;
      const durationMs = randomInt(4200, 5600);
      const t0 = performance.now();

      function frame(now) {
        const t = Math.min(1, (now - t0) / durationMs);
        const e = easeOutCubic(t);
        rotation = startAngle + delta * e;
        drawWheel(rotation);
        if (t < 1) {
          rafId = requestAnimationFrame(frame);
        } else {
          rotation = endAngle;
          drawWheel(rotation);
          spinning = false;
          spinBtn.disabled = false;
          burstSparkles();
          openModal(SEGMENTS[winnerIndex]);
        }
      }

      rafId = requestAnimationFrame(frame);
    }

    /* ========== Eventos ========== */
    spinBtn.addEventListener("click", startSpin);
    modalClose.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modalBackdrop.classList.contains("is-open")) {
        closeModal();
      }
    });

    window.addEventListener("resize", () => {
      if (!spinning) layoutCanvas();
    });

    layoutCanvas();
  </script>
</body>
